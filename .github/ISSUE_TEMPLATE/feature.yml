name: Feature request
description: Something shep does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two parts below. The first is for people, the second is for the coding
        agents and scripts that also read these issues.

  - type: textarea
    id: summary
    attributes:
      label: What you want to do
      description: |
        Describe the thing you are trying to achieve, not only the feature you
        have in mind for it. The problem often has a shorter answer than the
        solution it arrived with.
      placeholder: |
        I run three copies of the same app and want them to share one log file
        rather than one each.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if there is one, and where it falls down.
    validations:
      required: false

  - type: textarea
    id: precise
    attributes:
      label: Precise details
      description: Read by automated tooling and by coding agents. Be exact rather than readable.
      value: |
        surface: (a verb, a flag, a Flockfile key, a JSON field, an exit code)
        proposed shape:
        breaking:
        prior art:
        docs affected:
    validations:
      required: false

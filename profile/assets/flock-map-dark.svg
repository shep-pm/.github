<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="How shep fits together: you drive the CLI, lookout or whistle; they speak to the shepherd over a control socket; the shepherd supervises your flock and its dogs; a sheep answers back over the shepherd channel.">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#7e9186"/>
  </marker>
</defs>
<rect width="880" height="470" rx="14" fill="#131e18"/>

<!-- what you drive -->
<rect x="150" y="24" width="580" height="82" rx="12" fill="#1b2a21" stroke="#35493c" stroke-width="2"/><rect x="150" y="24" width="580" height="4" rx="2" fill="#f6d072"/>
<text x="440" y="58" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17" font-weight="700" fill="#f0ecdc" text-anchor="middle" textLength="438.6" lengthAdjust="spacingAndGlyphs">shep · lookout (TUI) · whistle (MCP) · JSON</text>
<text x="440" y="84" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="middle" textLength="344.4" lengthAdjust="spacingAndGlyphs">what you drive: one binary, every surface</text>

<line x1="440" y1="106" x2="440" y2="158" stroke="#7e9186" stroke-width="2" marker-end="url(#head)"/>
<text x="452" y="138" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="117.6" lengthAdjust="spacingAndGlyphs">control socket</text>

<!-- the shepherd -->
<rect x="150" y="162" width="580" height="90" rx="12" fill="#1b2a21" stroke="#35493c" stroke-width="2"/><rect x="150" y="162" width="580" height="4" rx="2" fill="#ff7b4f"/>
<text x="440" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f0ecdc" text-anchor="middle">the shepherd</text>
<text x="440" y="230" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="middle" textLength="546.0" lengthAdjust="spacingAndGlyphs">one daemon · re-execs itself to detach · never binds your sockets</text>

<line x1="281" y1="252" x2="281" y2="310" stroke="#7e9186" stroke-width="2" marker-end="url(#head)"/>
<text x="293" y="288" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="84.0" lengthAdjust="spacingAndGlyphs">supervises</text>
<line x1="599" y1="252" x2="599" y2="310" stroke="#7e9186" stroke-width="2" marker-end="url(#head)"/>
<text x="611" y="288" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="84.0" lengthAdjust="spacingAndGlyphs">supervises</text>

<!-- the flock -->
<rect x="136" y="314" width="290" height="132" rx="12" fill="#1b2a21" stroke="#35493c" stroke-width="2"/><rect x="136" y="314" width="290" height="4" rx="2" fill="#1f4a33"/>
<text x="158" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0ecdc" text-anchor="start">the flock</text>
<text x="158" y="376" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="226.8" lengthAdjust="spacingAndGlyphs">your long-running processes</text>
<text x="158" y="402" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#bfcfc2" text-anchor="start" textLength="171.0" lengthAdjust="spacingAndGlyphs">web   worker   cron</text>
<text x="158" y="428" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="243.6" lengthAdjust="spacingAndGlyphs">restarted, backed off, logged</text>

<!-- the dogs -->
<rect x="454" y="314" width="290" height="132" rx="12" fill="#1b2a21" stroke="#35493c" stroke-width="2"/><rect x="454" y="314" width="290" height="4" rx="2" fill="#f6d072"/>
<text x="476" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0ecdc" text-anchor="start">the dogs</text>
<text x="476" y="376" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="210.0" lengthAdjust="spacingAndGlyphs">plugins the shepherd runs</text>
<text x="476" y="402" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#bfcfc2" text-anchor="start" textLength="225.0" lengthAdjust="spacingAndGlyphs">metrics  bark  log-rotate</text>
<text x="476" y="428" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="start" textLength="210.0" lengthAdjust="spacingAndGlyphs">deploy, and any you write</text>

<!-- the shepherd channel, back up from a sheep -->
<path d="M136 396 L88 396 L88 207 L150 207" fill="none" stroke="#7e9186" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#head)"/>
<text x="440" y="462" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#7e9186" text-anchor="middle" textLength="688.8" lengthAdjust="spacingAndGlyphs">a sheep answers back over the shepherd channel: readiness, metrics, custom actions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-label="How shep fits together: you drive the CLI, lookout or whistle; they speak to the shepherd over a control socket; the shepherd supervises your flock and its dogs; a sheep answers back over the shepherd channel.">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3d5245"/>
  </marker>
</defs>
<rect width="880" height="452" rx="14" fill="#fbf6e7"/>

<!-- what you drive -->
<rect x="150" y="24" width="580" height="74" rx="12" fill="#fffdf5" stroke="#17251c" stroke-width="2"/><rect x="150" y="24" width="580" height="4" rx="2" fill="#f3c44c"/>
<text x="440" y="54" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#17251c" text-anchor="middle" textLength="441.0" lengthAdjust="spacingAndGlyphs">shep  ·  lookout (TUI)  ·  whistle (MCP)  ·  JSON</text>
<text x="440" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="middle" textLength="302.4" lengthAdjust="spacingAndGlyphs">what you drive - one binary, every surface</text>

<line x1="440" y1="98" x2="440" y2="146" stroke="#3d5245" stroke-width="2" marker-end="url(#head)"/>
<text x="452" y="128" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="100.8" lengthAdjust="spacingAndGlyphs">control socket</text>

<!-- the shepherd -->
<rect x="150" y="150" width="580" height="82" rx="12" fill="#fffdf5" stroke="#17251c" stroke-width="2"/><rect x="150" y="150" width="580" height="4" rx="2" fill="#e0552b"/>
<text x="440" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#17251c" text-anchor="middle">the shepherd</text>
<text x="440" y="212" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="middle" textLength="468.0" lengthAdjust="spacingAndGlyphs">one daemon · re-execs itself to detach · never binds your sockets</text>

<line x1="286" y1="232" x2="286" y2="290" stroke="#3d5245" stroke-width="2" marker-end="url(#head)"/>
<text x="296" y="268" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="72.0" lengthAdjust="spacingAndGlyphs">supervises</text>
<line x1="594" y1="232" x2="594" y2="290" stroke="#3d5245" stroke-width="2" marker-end="url(#head)"/>
<text x="604" y="268" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="72.0" lengthAdjust="spacingAndGlyphs">supervises</text>

<!-- the flock -->
<rect x="150" y="294" width="272" height="118" rx="12" fill="#fffdf5" stroke="#17251c" stroke-width="2"/><rect x="150" y="294" width="272" height="4" rx="2" fill="#6fcb6b"/>
<text x="170" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#17251c" text-anchor="start">the flock</text>
<text x="170" y="348" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="194.4" lengthAdjust="spacingAndGlyphs">your long-running processes</text>
<text x="170" y="372" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#3d5245" text-anchor="start" textLength="148.2" lengthAdjust="spacingAndGlyphs">web   worker   cron</text>
<text x="170" y="394" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="208.8" lengthAdjust="spacingAndGlyphs">restarted, backed off, logged</text>

<!-- the dogs -->
<rect x="458" y="294" width="272" height="118" rx="12" fill="#fffdf5" stroke="#17251c" stroke-width="2"/><rect x="458" y="294" width="272" height="4" rx="2" fill="#f3c44c"/>
<text x="478" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#17251c" text-anchor="start">the dogs</text>
<text x="478" y="348" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="180.0" lengthAdjust="spacingAndGlyphs">plugins the shepherd runs</text>
<text x="478" y="372" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#3d5245" text-anchor="start" textLength="195.0" lengthAdjust="spacingAndGlyphs">metrics  bark  log-rotate</text>
<text x="478" y="394" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="start" textLength="180.0" lengthAdjust="spacingAndGlyphs">deploy, and any you write</text>

<!-- the shepherd channel, back up from a sheep -->
<path d="M150 366 L96 366 L96 191 L150 191" fill="none" stroke="#3d5245" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#head)"/>
<text x="440" y="438" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#7a8c80" text-anchor="middle" textLength="590.4" lengthAdjust="spacingAndGlyphs">a sheep answers back over the shepherd channel: readiness, metrics, custom actions</text>
</svg>

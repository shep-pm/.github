<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="shep: a process manager written in Rust. Three sheep graze on a hillside under a low sun.">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a8dcf5"/>
    <stop offset="1" stop-color="#e9f5e0"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#f7d97e" stop-opacity="1"/>
    <stop offset="1" stop-color="#f7d97e" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect width="880" height="300" rx="14"/></clipPath>
</defs>
<style>
  .sheep { animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
  .cloud { animation: drift 74s linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1140px); } }
  .glow { animation: breathe 7s ease-in-out infinite; transform-origin: 754px 74px; }
  @keyframes breathe { 0%, 100% { opacity: .30; transform: scale(1); } 50% { opacity: .46; transform: scale(1.07); } }
  .star { animation: twinkle 4.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="880" height="300" fill="url(#sky)"/>
  
  <circle class="glow" cx="754" cy="74" r="84" fill="url(#glow)" opacity=".30"/>
  <circle cx="754" cy="74" r="30" fill="#f3c44c"/>

  <g class="cloud" opacity=".9">

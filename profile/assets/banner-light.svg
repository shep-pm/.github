  <text x="56" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#3d5245" text-anchor="start">A process manager written in Rust.</text>
  <text x="56" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#3d5245" text-anchor="start">One shepherd keeps your flock alive.</text>
